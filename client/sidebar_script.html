<script>
  const app = {
    state: {
      items: [],
      promptTitles: [],
      allPrompts: {},
      isLoading: false,
      error: null,
    },

    init: async function() {
      try {
        this.state.isLoading = true;
        this.ui.showLoadingSpinner();

        let data;
        if (typeof preloadedData !== 'undefined' && preloadedData && Object.keys(preloadedData).length > 0) {
          data = preloadedData;
        } else {
          data = await this.server.getSidebarData();
        }

        this.state.items = data.items;
        this.state.promptTitles = data.promptTitles;
        this.state.allPrompts = data.allPrompts;

        this.ui.buildFilterButtons(data.sheets);
        this.ui.sendTextToSearch(initialSearchInput);
        this.ui.hideLoadingSpinner();
        this.events.setupAllEventListeners();
      } catch (error) {
        this.ui.handleError('Failed to initialize sidebar', error);
      } finally {
        this.state.isLoading = false;
      }
    },

    server: {
      getSidebarData: function() {
        return new Promise((resolve, reject) => {
          google.script.run
            .withSuccessHandler(response => resolve(JSON.parse(response)))
            .withFailureHandler(reject)
            .DataService.getSidebarData();
        });
      },
      // ... other server functions
    },

    ui: {
      buildFilterButtons: function(sheets) {
        const filterContainer = document.getElementById('filter');
        if (!filterContainer) return;
        const templateContent = document.getElementById('filter-button').content;
        if (!templateContent) return;
        const uniqueButtons = this.getUniqueFilterButtons(sheets);
        uniqueButtons.forEach((button, index) => {
          this.createAndAppendButton(button, filterContainer, templateContent, index);
        });
      },

      getUniqueFilterButtons: function(sheets) {
        const allButtons = sheets.map(sheetData => ({
          buttonName: sheetData.sheetButton,
          buttonStyle: `btn-outline-${sheetData.sheetStyle}`,
          filterTarget: sheetData.sheetTag
        }));
        return Array.from(new Set(allButtons.map(button => JSON.stringify(button)))).map(button => JSON.parse(button));
      },

      createAndAppendButton: function(button, container, template, index) {
        const buttonTemplate = template.cloneNode(true);
        const elButton = buttonTemplate.querySelector('.btn');
        if (elButton) {
          elButton.id = `filter-btn-${index}`;
          elButton.classList.add(button.buttonStyle);
          elButton.innerHTML = button.buttonName;
          elButton.dataset.filterTarget = button.filterTarget;
          container.appendChild(buttonTemplate);
        }
      },

      populateSearchResults: function(resultsArray) {
        const topList = document.getElementById('topList');
        if (!topList) return;
        topList.innerHTML = '';
        const templateContent = document.getElementById('template-list-item').content;
        if (!templateContent) return;
        resultsArray.forEach(resultObj => {
          this.createAndAppendListItem(resultObj, topList, templateContent);
        });
      },

      createAndAppendListItem: function(resultObj, container, template) {
        if (!template) return;
        const listItemTemplate = template.cloneNode(true);
        const elListItem = listItemTemplate.querySelector('li');
        if (elListItem) {
          elListItem.classList.add(`list-group-item-${resultObj.itemStyle}`);
          elListItem.setAttribute('data-item-text', resultObj.itemText);
          elListItem.querySelector('.item-title').textContent = resultObj.itemTitle;
          container.appendChild(listItemTemplate);
        }
      },

      showLoadingSpinner: function() {
        const loading = document.getElementById('loading');
        if (loading) loading.classList.remove('invisible');
      },

      hideLoadingSpinner: function() {
        const loading = document.getElementById('loading');
        if (loading) loading.classList.add('invisible');
      },

      disableActionButtons: function() {
        document.querySelectorAll('.action-button').forEach(button => button.disabled = true);
      },

      enableActionButtons: function() {
        document.querySelectorAll('.action-button').forEach(button => button.disabled = false);
      },

      clearListBotton: function() {
        const listBottom = document.getElementById('listBotton');
        if (listBottom) listBottom.innerHTML = '';
      },

      getConcatenatedListItemsText: function() {
        const listItems = document.querySelectorAll('#listBotton li.list-group-item');
        return Array.from(listItems).map(listItem => listItem.dataset.itemText || '').join('\n');
      },

      handleError: function(message, error = '') {
        console.error(message, error);
      },

      addItemToBottomList: function(item) {
        const listBottom = document.getElementById('listBotton');
        if (!listBottom) return;
        const clone = item.cloneNode(true);
        listBottom.appendChild(clone);
      },

      sendTextToSearch: function(text, isFilterClick = false) {
        this.setSearchInputValue(text + ' ');
        app.events.executeSearch(isFilterClick ? text.trim() : null);
      },

      setSearchInputValue: function(value) {
        const input = document.getElementById('searchInputId');
        if (input) input.value = value;
      }
    },

    events: {
      isInitialized: false,

      setupAllEventListeners: function() {
        if (this.isInitialized) return;
        this.setupBasicEventListeners();
        this.setupListEventListeners();
        this.setupSortableList();
        this.isInitialized = true;
      },

      setupBasicEventListeners: function() {
        const elements = this.getBasicElements();
        this.setupGlobalListener(elements.globalElement);
        this.setupSearchInputListener(elements.searchInput);
      },

      getBasicElements: function() {
        return {
          globalElement: document.getElementById('global'),
          searchInput: document.getElementById('searchInputId')
        };
      },

      setupGlobalListener: function(globalElement) {
        if (globalElement) {
          globalElement.addEventListener('click', (e) => this.handleGlobalClick(e));
        }
      },

      setupSearchInputListener: function(searchInput) {
        if (searchInput) {
          searchInput.addEventListener('input', () => this.executeSearch());
        }
      },

      setupListEventListeners: function() {
        const topList = document.getElementById('topList');
        const listBottom = document.getElementById('listBotton');
        if (topList) {
          topList.addEventListener('click', (e) => this.handleTopListClick(e));
        }
        if (listBottom) {
          listBottom.addEventListener('click', (e) => this.handleBottomListClick(e));
        }
      },

      setupSortableList: function() {
        const listBottom = document.getElementById('listBotton');
        if (listBottom) {
          new Sortable(listBottom, {
            animation: 150,
            onAdd: (evt) => this.handleItemAddedToList(evt)
          });
        }
      },

      handleGlobalClick: function(e) {
        if (this.isListItem(e.target) || e.target.closest('li.list-group-item')) return;
        if (this.isFilterButtonClicked(e.target)) {
          app.ui.sendTextToSearch(e.target.dataset.filterTarget, true);
        } else if (this.isClearButtonClicked(e.target)) {
          app.ui.sendTextToSearch('');
        }
        this.setFocusToSearch();
      },

      handleTopListClick: function(e) {
        if (this.isListItem(e.target)) {
          e.preventDefault();
          this.addItemToBottomList(e.target.closest('li.list-group-item'));
          this.setFocusToSearch();
        }
      },

      handleBottomListClick: function(e) {
        if (this.isBadgeClicked(e.target)) {
          this.removeListItem(e.target.closest('li'));
        }
      },

      handleItemAddedToList: function(evt) {
        const item = evt.item;
        if (!item.querySelector('.badge')) {
          this.addBadge(item);
        }
        this.maintainOriginalBackground(item);
      },

      isListItem: function(element) {
        return element && element.matches('li.list-group-item, li.list-group-item *');
      },

      isFilterButtonClicked: function(element) {
        return element.matches('.filter');
      },

      isClearButtonClicked: function(element) {
        return element.matches('.clear');
      },

      isBadgeClicked: function(element) {
        return element && element.matches('span.badge');
      },

      isItemInList: function(list, itemTitle) {
        const listItemElements = Array.from(list.getElementsByClassName('item-title'));
        return listItemElements.some(itemElement => itemElement.textContent.trim() === itemTitle);
      },

      addItemToBottomList: function(listItem) {
        const itemTitle = this.getItemText(listItem);
        const bottomList = document.getElementById('listBotton');
        if (!bottomList || this.isItemInList(bottomList, itemTitle)) return;
        const tempItem = listItem.cloneNode(true);
        bottomList.appendChild(tempItem);
        const currentTitlesInBottomList = Array.from(bottomList.querySelectorAll('.item-title')).map(el => el.textContent.trim());
        const processedItems = new Set();
        let orderedItems = [];
        currentTitlesInBottomList.forEach(title => {
          this.collectDependencies(title, processedItems, orderedItems);
        });
        bottomList.innerHTML = '';
        orderedItems.forEach(title => {
          const newItem = this.createListItem(title);
          if (newItem) {
            bottomList.appendChild(newItem);
          }
        });
        this.toggleListVisibility();
      },

      collectDependencies: function(itemTitle, processedItems, orderedItems) {
        if (processedItems.has(itemTitle)) return;
        processedItems.add(itemTitle);
        const item = app.state.items.find((i) => i.itemTitle === itemTitle);
        if (!item) return;
        if (item.requires && item.requires !== 'None') {
          const dependencies = item.requires.split(',').map(s => s.trim());
          dependencies.forEach(dep => {
            if (dep) this.collectDependencies(dep, processedItems, orderedItems);
          });
        }
        if (!orderedItems.includes(itemTitle)) {
          orderedItems.push(itemTitle);
        }
      },

      getItemText: function(listItem) {
        return listItem.querySelector('.item-title').textContent.trim();
      },

      createListItem: function(itemTitle) {
        const item = app.state.items.find((i) => i.itemTitle === itemTitle);
        if (!item) return null;
        const templateContent = document.getElementById('template-list-item').content;
        if (!templateContent) return null;
        const clonedItem = templateContent.cloneNode(true);
        const itemTitleElement = clonedItem.querySelector('.item-title');
        itemTitleElement.textContent = item.itemTitle;
        const listItemElement = clonedItem.querySelector('li');
        listItemElement.setAttribute('data-item-text', item.itemText);
        const badgeElement = document.createElement('span');
        badgeElement.className = 'badge text-bg-danger rounded-pill';
        badgeElement.textContent = 'del';
        listItemElement.appendChild(badgeElement);
        return clonedItem;
      },

      removeListItem: function(item) {
        item.parentNode.removeChild(item);
        this.toggleListVisibility();
      },

      addBadge: function(item) {
        const badge = document.createElement('span');
        badge.className = 'badge text-bg-primary rounded-pill';
        badge.textContent = 'del';
        item.appendChild(badge);
        return item;
      },

      maintainOriginalBackground: function(item) {
        item.className = `list-group-item d-flex justify-content-between align-items-center ${item.className.replace('list-group-item-action', '')}`;
      },

      executeSearch: function(filterTarget = null) {
        const searchInput = this.getSearchInputValue();
        let resultsArray = searchInput.trim() === '' ? [] : this.filterItems(searchInput);
        if (filterTarget && resultsArray.length > 0) {
          resultsArray = this.sortResults(resultsArray, filterTarget);
        }
        app.ui.populateSearchResults(resultsArray);
      },

      getSearchInputValue: function() {
        const input = document.getElementById('searchInputId');
        return input ? input.value.toLowerCase().trim() : '';
      },

      filterItems: function(searchInput) {
        const itemFilter = new app.ItemFilter(app.state.items);
        return itemFilter.filterBySearchTerm(searchInput);
      },

      setFocusToSearch: function() {
        const input = document.getElementById('searchInputId');
        if (input) input.focus();
      },

      toggleListVisibility: function() {
        const listBottom = document.getElementById('listBotton');
        if (listBottom && listBottom.children.length === 0) {
          listBottom.classList.add('hide-element');
        } else if (listBottom) {
          listBottom.classList.remove('hide-element');
        }
      },

      sortResults: function(results, filterTarget) {
        const topItems = [];
        const otherItems = [];
        const lowerCaseFilterTarget = filterTarget.toLowerCase();
        for (const item of results) {
          if (item.itemSheet.toLowerCase() === lowerCaseFilterTarget) {
            topItems.push(item);
          } else {
            otherItems.push(item);
          }
        }
        return topItems.concat(otherItems);
      },

      handleBtnAppendClick: function() {
        app.ui.showLoadingSpinner();
        const listItems = document.querySelectorAll('#listBotton li.list-group-item');
        if (listItems.length === 0) {
          google.script.run.withSuccessHandler(() => {
            app.ui.hideLoadingSpinner();
            app.ui.enableActionButtons();
          }).withFailureHandler((error) => {
            app.ui.handleError('Erro na formatação:', error);
            app.ui.hideLoadingSpinner();
            app.ui.enableActionButtons();
          }).DocumentService.executeFormat();
          return;
        }
        const concatenatedText = app.ui.getConcatenatedListItemsText();
        const obj = { text: concatenatedText, shouldFormat: true };
        google.script.run.withSuccessHandler((result) => {
          if (result.success) {
            this.handleAppendSuccess();
          } else {
            if (result.action === 'show_dialog') {
              google.script.run.withSuccessHandler(() => {
                this.handleAppendSuccess();
              }).withFailureHandler((error) => {
                app.ui.handleError('Erro ao abrir diálogo de seleção:', error);
                app.ui.hideLoadingSpinner();
                app.ui.enableActionButtons();
              }).BrushMagicService.openAppendChoiceDialog(result.uniqueHeadline1s, result.textToInsert, result.shouldFormat);
            } else {
              alert('❌ ' + result.message);
              app.ui.hideLoadingSpinner();
              app.ui.enableActionButtons();
            }
          }
        }).withFailureHandler((error) => {
          app.ui.handleError('Erro na operação:', error);
          app.ui.hideLoadingSpinner();
          app.ui.enableActionButtons();
        }).AppendInsertService.validateAndExecuteAppend(JSON.stringify(obj));
      },

      handleAppendSuccess: function() {
        app.ui.clearListBotton();
        app.ui.enableActionButtons();
        app.ui.hideLoadingSpinner();
      },

      handleBtnCursorTextClick: function() {
        const listItems = document.querySelectorAll('#listBotton li.list-group-item');
        if (listItems.length === 0) return;
        app.ui.showLoadingSpinner();
        const concatenatedText = app.ui.getConcatenatedListItemsText();
        const obj = { text: concatenatedText, shouldFormat: false };
        google.script.run.withSuccessHandler((result) => {
          if (result.success) {
            this.handleCursorTextSuccess();
          } else {
            alert('❌ ' + result.message);
            app.ui.hideLoadingSpinner();
            app.ui.enableActionButtons();
          }
        }).withFailureHandler((error) => {
          app.ui.handleError('Erro na operação:', error);
          app.ui.hideLoadingSpinner();
          app.ui.enableActionButtons();
        }).AppendInsertService.checkSelectionAndInsertAtCursor(JSON.stringify(obj));
      },

      handleCursorTextSuccess: function() {
        app.ui.clearListBotton();
        app.ui.enableActionButtons();
        app.ui.hideLoadingSpinner();
      },

      handleBtnBrushClick: function() {
        app.ui.showLoadingSpinner();
        google.script.run.withSuccessHandler((result) => {
          app.ui.hideLoadingSpinner();
          if (!result.success) {
            alert(`❌ ${result.message}`);
          }
        }).withFailureHandler((error) => {
          app.ui.hideLoadingSpinner();
          alert('❌ Erro no processamento brush: ' + error.message);
        }).BrushMagicService.executeCompleteBrushFlowWithPairs();
      },

      handleBtnMagicClick: function() {
        app.ui.showLoadingSpinner();
        const promptsData = this.preparePromptsDataForServer();
        google.script.run.withSuccessHandler(() => {
          app.ui.hideLoadingSpinner();
        }).withFailureHandler((error) => {
          app.ui.handleError('Erro ao abrir modal mágico:', error);
          app.ui.hideLoadingSpinner();
        }).BrushMagicService.callMagicModal(promptsData);
      },

      preparePromptsDataForServer: function() {
        try {
          const allPrompts = app.state.allPrompts;
          const promptsArray = [];
          if (allPrompts) {
            Object.keys(allPrompts).forEach(key => {
              const prompt = allPrompts[key];
              promptsArray.push({
                optionText: key,
                fromHeadline2: prompt.fromHeadline2,
                toHeadline2: prompt.toHeadline2,
                promptContent: prompt.content
              });
            });
          }
          return promptsArray;
        } catch (error) {
          return [];
        }
      }
    }
  };

  document.addEventListener('DOMContentLoaded', () => {
    app.init();
  });
</script>
