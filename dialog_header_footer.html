<!DOCTYPE html>
<html>
  <head>
    <base target="_top">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css"
      integrity="sha384-xOolHFLEh07PJGoPkLv1IbcEPTNtaed2xpHsD9ESMhqIYd0nLMwNLD69Npy4HI+N" crossorigin="anonymous">
    <style>
      body { padding: 1rem; }
      .btn-block { margin-top: 0.75rem; }
      h5 { margin-top: 1rem; margin-bottom: 0.5rem; }
    </style>
  </head>
  <body>
    <div class="container">

      <h5>Choose Header</h5>
      <?!= headerRadios ?>

      <h5 class="mt-3">Choose Footer</h5>
      <?!= footerRadios ?>

      <button class="btn btn-primary btn-block" id="applyBtn" onclick="submitSelection();">
        Apply Selection
      </button>
      <button class="btn btn-secondary btn-block" onclick="google.script.host.close();">
        Cancel
      </button>

    </div>

    <script>
      function submitSelection() {
        document.getElementById('applyBtn').disabled = true;
        document.getElementById('applyBtn').textContent = 'Applying...';

        const selectedHeaderId = document.querySelector('input[name="headerRadio"]:checked').value;
        const selectedFooterId = document.querySelector('input[name="footerRadio"]:checked').value;

        google.script.run
          .withSuccessHandler(() => google.script.host.close())
          .withFailureHandler(error => {
            alert('Failed to apply: ' + error.message);
            google.script.host.close();
          })
          .HeaderFooterService.insertHeaderAndFooter(selectedHeaderId, selectedFooterId);
      }
    </script>
  </body>
</html>
